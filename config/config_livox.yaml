# pre process
ds_size: 0.25
maximum_corner_num: 100
localizeMode: false

# key points
plane_detection_thre: 0.007  # smaller -> stricter
plane_merge_normal_thre: 30.1 # norm angle
voxel_size: 1.5
voxel_init_num: 10
proj_image_resolution: 0.25
proj_dis_min: 0.1
proj_dis_max: 5
corner_thre: 10

# std descriptor
descriptor_near_num: 20
descriptor_min_len: 2
descriptor_max_len: 30
non_max_suppression_radius: 2  # m
std_side_resolution: 0.2

# candidate search
skip_near_num: 20
candidate_num: 50
sub_frame_num: 50
vertex_diff_threshold: 0.7  # gradient diff ratio
rough_dis_threshold: 0.015  # side length diff ratio
normal_threshold: 0.2   # normal diff
dis_threshold: 0.5  # point2plane dist
icp_threshold: 0.15
